<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://api.github.com; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; frame-src 'self'; base-uri 'none'; form-action 'none'">
<title>graph</title>
<style>
:root {
  --surface: #f6f7f9; --surface-2: #ffffff;
  --ink: #1a2028; --ink-3: #8a919c;
  --line: #d8dce2; --line-2: #c2c8d0;
  --shadow: 0 8px 28px rgba(20,26,34,.12);
  --bad: #c23a2b; --ok: #1f6f3f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface: #131820; --surface-2: #1a212b;
    --ink: #e8ebef; --ink-3: #6e7784;
    --line: #2b3441; --line-2: #39434f;
    --shadow: 0 8px 28px rgba(0,0,0,.5);
    --bad: #e9705e; --ok: #6fbf8e;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--surface); color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 13px;
  display: flex; flex-direction: column;
}
#gate { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 14px; overflow-y: auto; }
#gate[hidden] { display: none; }
form {
  width: 100%; max-width: 400px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); padding: 18px;
}
input[type=password] {
  width: 100%; min-width: 0; padding: 9px 11px; margin-bottom: 8px;
  border: 1px solid var(--line-2); border-radius: 8px;
  background: var(--surface); color: var(--ink);
  font: inherit; letter-spacing: .02em;
}
input[type=password]::placeholder { color: var(--ink-3); letter-spacing: 0; }
input[type=password]:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
input[type=password]:disabled { opacity: .4; cursor: not-allowed; }
#remwrap[hidden] { display: none; }
#remwrap { display: flex; align-items: flex-start; gap: 7px; margin: 2px 2px 10px; cursor: pointer; }
#rem { margin: 2px 0 0; flex: none; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  padding: 8px 16px; border-radius: 8px; cursor: pointer;
  font: inherit; font-weight: 500; border: 1px solid var(--ink);
  background: var(--ink); color: var(--surface);
}
button.sec { background: var(--surface-2); color: var(--ink-3); border-color: var(--line-2); font-weight: 400; }
button:disabled { opacity: .45; cursor: default; }
.small { font-size: 11.5px; color: var(--ink-3); line-height: 1.55; }
#status { margin: 10px 2px 0; font-size: 12px; color: var(--ink-3); min-height: 1.3em; word-break: break-word; }
#status.bad { color: var(--bad); }
#status.ok { color: var(--ok); }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--ink-3); font-size: 11.5px; }
#viewer { flex: 1; display: none; flex-direction: column; min-height: 0; }
#viewer.on { display: flex; }
#bar {
  flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 4px 10px; border-bottom: 1px solid var(--line); background: var(--surface);
}
#idline { font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#lock {
  flex: none; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-3);
  border-radius: 6px; padding: 2px 10px; font: inherit; font-size: 11.5px; font-weight: 400; cursor: pointer;
}
#frame { flex: 1; border: 0; width: 100%; }
@media (max-width: 420px) { form { padding: 14px; } #idline { font-size: 10px; } }
</style>
</head>
<body>

<div id="gate">
  <form id="form" autocomplete="off">
    <input id="pat" type="password" autocomplete="off" spellcheck="false"
           aria-label="GitHub Personal Access Token" placeholder="GitHub 토큰 (github_pat_...)">
    <input id="pw" type="password" autocomplete="off" spellcheck="false"
           aria-label="비밀번호" placeholder="비밀번호 (12자 이상)">

    <label id="remwrap" for="rem">
      <input id="rem" type="checkbox">
      <span class="small" id="remnote"></span>
    </label>

    <div class="row">
      <button id="open" type="submit">열기</button>
      <button id="reset" class="sec" type="button" hidden>재설정</button>
    </div>
    <div id="status" role="status"></div>

  </form>
</div>

<div id="viewer">
  <div id="bar"><span id="idline"></span><button id="lock" type="button">잠그기</button></div>
  <iframe id="frame" sandbox="allow-scripts" title="Paper Treasury Graph" referrerpolicy="no-referrer"></iframe>
</div>

<script>
"use strict";
/* 얇은 로더 — 내용의 정본은 비공개 저장소에 있고 이 페이지는 껍데기다.
   토큰은 메모리에만 두거나(기억 안 함) PBKDF2 310k → AES-GCM 봉인으로만 저장한다.
   URL·로그·오류 메시지·DOM 속성·평문 저장 어디에도 비밀이 남지 않는다. */

const OWNER = "expahn";
const REPO  = "paper-treasury";                       /* 비공개 정본 저장소 */
const FILE  = "vault/graph/index.html";               /* 기본 브랜치 기준 */
const SIG   = "graph-data";    /* 기존 게이트가 쓰던 구조 서명 그대로 — 내용이 아니다 */
const LSK   = "ptg.v1";        /* 이 페이지 전용 저장 키 */
const IDLE_MS = 30 * 60 * 1000;

let TOKEN = null, idleT = null;
/* 예외 문구에는 e.name 만 쓴다 — e.message 는 입력을 되비출 수 있어 토큰·비밀번호 유출 경로가 된다. */
const safeErr = (e) => (e && e.name ? String(e.name) : "UnknownError").replace(/[^A-Za-z]/g, "").slice(0, 40) || "UnknownError";
/* 안전하지 않은 출처(http)에서는 crypto.subtle 이 아예 없다 — 조용히 멈추지 말고 먼저 말한다. */
const CRYPTO_OK = !!(window.crypto && window.crypto.subtle && window.crypto.subtle.deriveKey);

const $ = (id) => document.getElementById(id);
const gate = $("gate"), viewer = $("viewer"), frame = $("frame");
const patEl = $("pat"), pwEl = $("pw"), remEl = $("rem"), remWrap = $("remwrap");
const statusEl = $("status"), openBtn = $("open"), resetBtn = $("reset");

const enc = (s) => new TextEncoder().encode(s);
const dec = (u) => new TextDecoder().decode(u);
const b64e = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = (b) => { const s = atob(String(b).replace(/\n/g, "")); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };

/* ===== 잠금 (PBKDF2 310k SHA-256 → AES-GCM 256) — 기록장과 동일 파라미터 ===== */
async function kdf(pw, salt, it) {
  const km = await crypto.subtle.importKey("raw", enc(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: it || 310000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(pat, pw, it) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await kdf(pw, salt, it);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, enc(pat)));
  return { v: 2, it: it || 310000, salt: b64e(salt), iv: b64e(iv), ct: b64e(ct) };
}
async function unseal(j, pw) {
  const k = await kdf(pw, b64d(j.salt), j.it || 310000);
  return dec(new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(j.iv) }, k, b64d(j.ct))));
}
/* 저장 접근은 전부 예외 안전하게 감싼다 — 사생활 보호 모드/저장 차단에서 페이지가 죽지 않고,
   실패를 성공으로 위장하지도 않는다. 탐지용 시험 기록조차 남기지 않는다(실제 쓰기로만 판정). */
const LS = {
  get() { try { return localStorage.getItem(LSK); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(LSK, v); return true; } catch (e) { return false; } },
  del() { try { localStorage.removeItem(LSK); } catch (e) { /* 지울 것이 없거나 접근 불가 */ } },
};
async function sealPAT(pat, pw) { return LS.set(JSON.stringify(await seal(pat, pw, 310000))); }
async function openPAT(pw) {
  let j; try { j = JSON.parse(LS.get()); }
  catch (e) { throw new Error("저장된 봉인이 손상됨 — '재설정' 후 다시 설정하세요."); }
  return unseal(j, pw);
}
const hasSeal = () => LS.get() !== null;

/* ===== 유휴 자동 재잠금 ===== */
/* 기록장 모듈과의 유일한 의도적 차이: reload 대신 relock() + 사유 표시.
   reload 는 재잠금 사유를 화면에서 지워버리고, '기억 안 함' 경로에서는 사고와 구분되지 않는다.
   보안 효과는 동일하다 — 메모리 토큰 소거 · iframe 비우기 · 입력칸 소거.
   주의: 그래프는 샌드박스 iframe 이라 그 안의 조작은 부모 문서에 보이지 않는다.
   따라서 이 타이머는 '마지막 부모 조작(열기·부모 문서 클릭/키입력) 후 30분'이다 —
   그래프 안에서만 조작하면 시한이 갱신되지 않는다(fail-closed). */
function armIdle() { clearTimeout(idleT); idleT = setTimeout(() => { relock(); setStatus("30분이 지나 자동으로 다시 잠갔습니다. 비밀번호를 다시 입력하세요."); }, IDLE_MS); }
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, () => { if (TOKEN) armIdle(); }, { passive: true }));

/* ===== UI ===== */
function setStatus(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }
function syncRem() {
  const on = remEl.checked;
  pwEl.disabled = !on;
  pwEl.placeholder = on ? "비밀번호 (12자 이상)" : "비밀번호 — 사용하지 않음";
  if (!on) pwEl.value = "";
  $("remnote").textContent = on ? "이 브라우저에 기억" : "기억 안 함";
}
function renderMode() {
  const locked = hasSeal();
  patEl.hidden = locked;  patEl.disabled = locked;
  remWrap.hidden = locked; remEl.disabled = locked;
  resetBtn.hidden = !locked;
  pwEl.disabled = false;
  pwEl.placeholder = locked ? "비밀번호" : "비밀번호 (12자 이상)";
  if (!locked) syncRem();
  setStatus("");
  openBtn.disabled = false;
  if (!CRYPTO_OK) {   /* http 등 안전하지 않은 출처 — 열 수 없음을 사유와 함께 알린다 */
    openBtn.disabled = true; patEl.disabled = true; pwEl.disabled = true; remEl.disabled = true;
    setStatus("이 주소에서는 브라우저 암호 기능(crypto.subtle)을 쓸 수 없습니다 — https 로 접속하세요.", "bad");
  }
}

/* ===== 열기 ===== */
async function fetchDoc(token) {
  setStatus("여는 중…");
  let res;
  try {
    res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`, {
      cache: "no-store",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github.raw+json",
        "X-GitHub-Api-Version": "2022-11-28",
      },
    });
  } catch (e) {
    setStatus("연결 실패 — 네트워크를 확인하세요. (요청이 전송되지 못했습니다)", "bad");
    return null;
  }
  if (!res.ok) {
    const map = {
      401: "토큰이 유효하지 않습니다 (만료·오타·회수됨).",
      403: "거부됨 — 요청 한도 초과이거나 토큰 권한(Contents: Read-only) 문제입니다.",
      404: "대상 파일이 기본 브랜치에 없거나(아직 병합 전) 이 토큰에 읽기 권한이 없습니다.",
    };
    setStatus(`${map[res.status] || "가져오기 실패"} (HTTP ${res.status}) — 열지 않았습니다.`, "bad");
    return null;
  }
  const html = await res.text();
  if (!html.trim()) {   /* 빈 응답을 '데이터 없음'으로 위장하지 않는다 */
    setStatus("응답 본문이 비어 있습니다 (HTTP 200, 0바이트) — 실패로 처리합니다.", "bad");
    return null;
  }
  if (html.indexOf(SIG) === -1) {
    setStatus("응답이 이 페이지가 여는 문서가 아닙니다 (서명 불일치) — 열지 않았습니다.", "bad");
    return null;
  }
  let etag = "";
  try { etag = res.headers.get("etag") || ""; } catch (e) { etag = ""; }
  const dg = new Uint8Array(await crypto.subtle.digest("SHA-256", enc(html)));
  const sha = Array.from(dg).map((b) => b.toString(16).padStart(2, "0")).join("").slice(0, 12);
  return { html, sha, etag, bytes: enc(html).length };
}
/* ===== srcdoc 주입 파이프라인 (순서 고정) =====
   ① fetch 원문 바이트 → ② SIG 서명 검사(원문 바이트에 대해 — fetchDoc 안에서 이미 끝났다)
   → ③ 외부 링크 제거 정규화 → ④ 프렐류드 선두 삽입 → ⑤ srcdoc 주입.
   ③은 이 페이지의 "외부 요청 0" 을 가져온 문서의 상태와 무관한 구조적 보장으로 만든다:
   불투명 오리진 srcdoc 에서 외부 렌더 차단 자원은 요청조차 발행되지 않아 파서가 멈추고
   화면이 백지가 된다. 정본을 언제 고치든 게이트 쪽에서 결합을 끊는다.
   ④+타이머는 그 백지를 "열림"으로 표시하지 못하게 하는 런타임 장치다. */
const EXT_URL = /^\s*(?:https?:)?\/\//i;
const BLOCKING_REL = /\b(?:stylesheet|preconnect|dns-prefetch|preload|prefetch|modulepreload)\b/i;
const HEAD_END = /<\/head\s*>|<body\b/i;
/* 적용 범위를 좁힌다(라운드4 F3): (a) </head>(없으면 <body>) 이전 구간에만 적용하고,
   (b) 어디에 있든 <script>…<\/script> 블록의 내용은 마스킹해 손대지 않는다.
   정규식은 HTML 파서가 아니라서, 페이로드 JSON 안의 <link…> 텍스트를 지우면 키 하나가
   조용히 사라진다(JSON.parse 는 성공 — 무증상 변형). 실제 외부요청 차단막은 CSP(위 meta)
   이고 이 정규화는 보조 층이다 — 회피 표기(속성값 안의 '>' 등)를 정규식은 놓친다. */
function normalizeDoc(html) {
  let removed = 0;
  const attr = (tag, name) => {
    const m = tag.match(new RegExp("\\b" + name + "\\s*=\\s*(\"[^\"]*\"|'[^']*'|[^\\s>]+)", "i"));
    return m ? m[1].replace(/^['\"]|['\"]$/g, "") : "";
  };
  const hm = HEAD_END.exec(html);
  const cut = hm ? hm.index + hm[0].length : html.length;   /* head 표지가 없으면 전 구간(안전측) — 페이로드는 (b) 가 지킨다 */
  let head = html.slice(0, cut);
  const tail = html.slice(cut);                             /* 이 뒤로는 한 바이트도 건드리지 않는다 */
  const holes = [];                                         /* (b) script 블록 마스킹 — 토큰은 매 호출 난수라 문서가 위조할 수 없다 */
  const TK = "\u0001" + Math.random().toString(36).slice(2) + "\u0001";
  head = head.replace(/<script\b[\s\S]*?(?:<\/script\s*>|$)/gi, (blk) => { holes.push(blk); return TK + (holes.length - 1) + TK; });
  head = head.replace(/<link\b[^>]*>/gi, (tag) => {
    const href = attr(tag, "href");
    if (!EXT_URL.test(href)) return tag;            /* data: · 상대경로는 건드리지 않는다 */
    if (!BLOCKING_REL.test(attr(tag, "rel"))) return tag;
    removed++; return "";
  });
  head = head.replace(/@import\s+(?:url\(\s*)?["']?\s*(?:https?:)?\/\/[^"')\s;]+["']?\s*\)?\s*;?/gi,
                    () => { removed++; return ""; });
  head = head.replace(new RegExp(TK + "(\\d+)" + TK, "g"), (_, i) => holes[+i]);
  return { html: head + tail, removed: removed };
}
/* ===== 준비 신호 = "파서 완주"가 아니라 "실제로 그려짐" (라운드4 F1) =====
   프렐류드는 load 이후 2 rAF 시점에 기하(문서 높이·최대 canvas 의 CSS 박스·뷰포트)와
   canvas 픽셀 표본(고유색 수·비지배 비율)을 함께 실어 보낸다. 판정은 전적으로 부모가 한다
   — 아래 GEO 는 부모의 임계이고, 자식에는 폴링을 언제 멈출지의 힌트로만 같은 값이 들어간다.
   한계(정직히): 이 장치는 **망가진 문서**를 잡지, **악의적 문서**를 잡지 못한다(문서가 값을
   위조할 수 있다). 악의적 문서에 대한 신뢰 근거는 비공개 정본·SIG·sandbox·CSP 다. */
/* 임계는 실측으로 정했다(측정 기록은 검증 트레일에) — 정본 13회·11구성의 최솟값 대비 여유:
   canvas 고유색 col ≥3 (정본 최소 24) · 비지배비율 nd ≥0.02 (정본 최소 0.1033, 스피너 0.0043·
   오류화면 0.0036 → 두 무리의 기하평균 0.021 근처) · 뷰포트 대비 면적 ≥1% (정본 최소 4.66%,
   375px 폭의 45×299 캔버스가 하한) · 면적 ≥400px² · 문서 높이 ≥16px. */
const GEO = { minDocH: 16, minArea: 400, minFrac: 0.01, minCol: 3, minND: 0.02, sampleMs: 2500 };
const PRELUDE = '<script>(function(){var sent=0,started=0,t0=0,n=0;'
  + 'function probe(){var r={t:"none",w:0,h:0,aw:0,ah:0,col:-1,nd:-1,dh:0,vw:0,vh:0,n:0,dt:0};'
  + 'try{r.dh=document.documentElement?document.documentElement.scrollHeight:0;'
  + 'r.vw=window.innerWidth||0;r.vh=window.innerHeight||0;'
  + 'var cs=document.getElementsByTagName("canvas"),el=null,a=-1,i,b,s;'
  + 'for(i=0;i<cs.length;i++){b=cs[i].getBoundingClientRect();s=b.width*b.height;'
  + 'if(s>a){a=s;el=cs[i];r.w=Math.round(b.width);r.h=Math.round(b.height);}}'
  + 'if(el){r.t="canvas";r.aw=el.width|0;r.ah=el.height|0;'
  + 'try{var x=el.getContext&&el.getContext("2d");'
  + 'if(x&&r.aw>0&&r.ah>0){var d=x.getImageData(0,0,r.aw,r.ah).data,m={},u=0,top=0,tot=0,j,k;'
  + 'for(j=0;j<d.length;j+=404){k=(d[j]>>4)+","+(d[j+1]>>4)+","+(d[j+2]>>4)+","+(d[j+3]>>6);tot++;'
  + 'if(m[k]===undefined){m[k]=0;u++;}m[k]++;if(m[k]>top)top=m[k];}'
  + 'r.col=u;r.nd=tot?Math.round((1-top/tot)*1e4)/1e4:0;}}catch(e){r.col=-2;}'
  + '}else if(document.body){b=document.body.getBoundingClientRect();r.t="body";'
  + 'r.w=Math.round(b.width);r.h=Math.round(b.height);}'
  + '}catch(e){}r.n=++n;r.dt=Date.now()-t0;return r;}'
  + 'function send(v){if(sent)return;sent=1;try{parent.postMessage({__gate:"ready",p:"paint",g:v},"*");}catch(e){}}'
  + 'function tick(){if(sent)return;var v=probe();'
  + 'if((v.col>=' + GEO.minCol + '&&v.nd>=' + GEO.minND + ')||v.dt>=' + GEO.sampleMs + '||v.n>60)return send(v);'
  + 'setTimeout(tick,120);}'
  + 'function go(){if(started)return;started=1;t0=Date.now();'
  + 'if(window.requestAnimationFrame)requestAnimationFrame(function(){requestAnimationFrame(tick);});'
  + 'setTimeout(tick,400);}'     /* 배경 탭에서는 rAF 가 멈춘다 — 타이머 폴백이 있어야 11구성이 산다 */
  + 'if(document.readyState==="complete")go();else window.addEventListener("load",go);'
  + '})();<' + '/script>';
const READY_MS = 8000;
let readyT = null, framePending = false;
/* 퇴화값은 ready 로 인정하지 않는다 — 빈 문서·0×0 캔버스·기본치 300×150·칠해지지 않은
   캔버스·사실상 한 색(스피너류)은 각각 다른 사유로 정직한 실패가 된다. */
function degenerate(g) {
  if (!g || typeof g !== "object") return "준비 신호에 크기 정보가 없습니다";
  if (!(g.dh >= GEO.minDocH)) return "문서가 비어 있습니다 (높이 " + (g.dh | 0) + "px)";
  const area = (g.w || 0) * (g.h || 0);
  if (!(area >= GEO.minArea)) return (g.t === "canvas" ? "캔버스" : "본문") + " 크기가 0에 가깝습니다 (" + (g.w | 0) + "×" + (g.h | 0) + ")";
  if (g.t === "canvas" && g.w === 300 && g.h === 150 && g.aw === 300 && g.ah === 150) return "캔버스가 기본치(300×150) 그대로입니다";
  const vp = (g.vw || 0) * (g.vh || 0);
  if (vp > 0 && area < vp * GEO.minFrac) return "그려진 영역이 화면 대비 무의미합니다 (" + (g.w | 0) + "×" + (g.h | 0) + ")";
  if (g.col >= 0) {
    if (g.col < GEO.minCol) return "캔버스가 칠해지지 않았습니다";
    if (g.nd < GEO.minND) return "캔버스가 사실상 한 색입니다 (비지배 " + g.nd + ")";
  }
  return "";
}
window.addEventListener("message", (ev) => {
  if (!framePending || ev.source !== frame.contentWindow) return;   /* 우리 프레임의 신호만 */
  const d = ev.data;
  if (!d || d.__gate !== "ready") return;
  const bad = degenerate(d.g);
  /* 크기·픽셀 표본만 남긴다(비밀도 내용도 아니다) — 감사·시험이 기계로 확인할 수 있게 */
  try { if (d.g && typeof d.g === "object") viewer.dataset.rgeom = JSON.stringify(d.g); } catch (e) { /* 무시 */ }
  if (bad) return renderFailed("문서는 받았지만 화면에 그려지지 않았습니다 (" + bad + ")");
  framePending = false; clearTimeout(readyT); readyT = null;
  viewer.dataset.render = "ready";      /* 비밀이 아닌 상태 표시 — 감사·시험이 기계로 확인할 수 있게 */
});
function renderFailed(why) {
  /* 빈 프레임을 열린 것처럼 두지 않는다 — 정직한 실패로 되돌린다(fail-closed). */
  framePending = false; clearTimeout(readyT); readyT = null;
  relock();                             /* rgeom 은 지우지 않는다 — 실패 사유의 근거가 남아야 한다 */
  viewer.dataset.render = "failed";
  setStatus(why || "문서는 받았지만 브라우저에서 렌더되지 않았습니다 (8초 안에 준비 신호가 오지 않았습니다) — 열린 것으로 표시하지 않습니다.", "bad");
}
function show(doc) {
  const norm = normalizeDoc(doc.html);            /* ③ */
  $("idline").textContent = `${REPO}:${FILE} · ${(doc.bytes / 1024).toFixed(1)} KB · sha256:${doc.sha}`
    + (doc.etag ? ` · etag ${doc.etag}` : " · etag 미확인")
    + (norm.removed ? ` · 외부자원 ${norm.removed}건 제거` : "");
  /* 뷰어를 먼저 보이게 해서 iframe 에 레이아웃(폭·높이)을 준 뒤에 문서를 넣는다.
     display:none 인 프레임에 주입하면 뷰어 앱이 컨테이너를 0폭으로 재어 캔버스를
     0×0 으로 만든다 — 콘솔 에러 없이 백지가 되는 경로다(실측으로 잡았다). */
  gate.hidden = true;
  viewer.classList.add("on");
  void frame.offsetHeight;                        /* 강제 레이아웃 */
  framePending = true;
  viewer.dataset.render = "pending";
  clearTimeout(readyT);
  readyT = setTimeout(renderFailed, READY_MS);
  frame.srcdoc = PRELUDE + norm.html;             /* ④⑤ — 식별자(sha256·바이트)는 원문 기준 */
  setStatus("");
  armIdle();
}
function relock() {
  TOKEN = null;
  clearTimeout(idleT);
  clearTimeout(readyT); readyT = null; framePending = false;
  delete viewer.dataset.render;
  frame.srcdoc = "";
  patEl.value = ""; pwEl.value = "";
  $("idline").textContent = "";
  viewer.classList.remove("on");
  gate.hidden = false;
  renderMode();
  pwEl.focus();
}

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  openBtn.disabled = true;
  try {
    if (hasSeal()) {
      const pw = pwEl.value;
      if (!pw) return setStatus("비밀번호를 입력하세요.", "bad");
      let pat;
      try { pat = await openPAT(pw); }
      catch (e) { return setStatus(e.name === "OperationError" ? "비밀번호가 틀렸습니다."
        : "봉인을 열지 못했습니다 (" + safeErr(e) + ") — '재설정' 후 다시 설정하세요.", "bad"); }
      pwEl.value = "";
      const doc = await fetchDoc(pat);
      if (!doc) return;
      TOKEN = pat; show(doc);
    } else {
      const pat = patEl.value.trim();
      if (!pat) return setStatus("토큰을 붙여넣으세요.", "bad");
      const remember = remEl.checked;
      const pw = remember ? pwEl.value : "";
      if (remember && pw.length < 12) return setStatus("비밀번호는 12자 이상으로 하세요.", "bad");
      /* 유효성이 확인된 뒤에만 봉인한다 — 실패한 시도는 아무것도 남기지 않는다 */
      const doc = await fetchDoc(pat);
      if (!doc) return;
      if (remember && !(await sealPAT(pat, pw)))
        return setStatus("이 브라우저가 저장을 막고 있어 기억할 수 없습니다 — '이 브라우저에 기억' 체크를 해제하고 다시 여세요.", "bad");
      patEl.value = ""; pwEl.value = "";
      TOKEN = pat; show(doc);
    }
  } catch (e) {
    /* 예상 못 한 예외(암호 API 부재·digest 거부·본문 읽기 거부 등)를 조용한 멈춤으로 두지 않는다.
       문구는 e.name 만 담는다 — 토큰·비밀번호는 어떤 경로로도 화면에 나오지 않는다. */
    setStatus("예상치 못한 오류로 열지 못했습니다 (" + safeErr(e) + "). 다시 시도하거나 https 접속·토큰 상태를 확인하세요.", "bad");
  } finally { openBtn.disabled = false; }
});

remEl.addEventListener("change", syncRem);
resetBtn.addEventListener("click", () => {
  if (confirm("이 브라우저에 저장된 봉인을 삭제하고 처음부터 다시 설정할까요?")) {
    LS.del();
    relock();
  }
});
$("lock").addEventListener("click", relock);

renderMode();
(hasSeal() ? pwEl : patEl).focus();
</script>
</body>
</html>
